# nginx-Konfiguration für example.invalid – die Fassung **mit** TLS.
#
# Warum es diese Datei gibt: certbot schreibt seinen TLS-Block in die Datei unter
# /etc/nginx/sites-available/. install.sh kopiert die Vorlage aus dem Repository aber bei jedem
# Aufruf dorthin – und damit wäre der Block bei jedem Deployment wieder weg. Steht die Domain
# hinter Cloudflare, fällt der Ursprungsserver dann auf Port 443 in irgendeinen anderen vHost, und
# die Seite zeigt plötzlich etwas Fremdes. Deshalb gehört TLS hier ins Repository, nicht in eine
# Datei, die überschrieben wird.
#
# install.sh nimmt diese Fassung automatisch, sobald es
# /etc/letsencrypt/live/example.invalid/fullchain.pem gibt.
#
# Cloudflare muss auf "Full (strict)" stehen. Flexible TLS lässt den Weg von Cloudflare zum
# Ursprung unverschlüsselt und wird absichtlich nicht unterstützt.

# Nur eine TCP-Verbindung aus einem offiziellen Cloudflare-Netz darf CF-Connecting-IP setzen.
# `$remote_addr` wird auf diesem Server durch ngx_http_realip_module bereits auf die Besucher-IP
# umgeschrieben; `$realip_remote_addr` bleibt dagegen immer die tatsächliche TCP-Gegenstelle.
# Quelle: https://www.cloudflare.com/ips/ (geprüft 2026-09-02).
geo $realip_remote_addr $afk_from_cloudflare {
    default 0;
    192.0.2.1/20 1;
    192.0.2.1/22 1;
    192.0.2.1/22 1;
    192.0.2.1/22 1;
    192.0.2.1/18 1;
    192.0.2.1/18 1;
    192.0.2.1/20 1;
    192.0.2.1/20 1;
    192.0.2.1/22 1;
    192.0.2.1/17 1;
    192.0.2.1/15 1;
    192.0.2.1/13 1;
    192.0.2.1/14 1;
    192.0.2.1/13 1;
    192.0.2.1/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

map "$afk_from_cloudflare:$http_cf_connecting_ip" $afk_client_ip {
    ~^1:(?<afk_cloudflare_client>[0-9A-Fa-f:.]+)$ $afk_cloudflare_client;
    default $remote_addr;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.invalid example.invalid;
    # Die Domain liegt vollständig hinter Cloudflare. Direkter Zugriff auf die bekannte
    # Ursprungs-IP würde WAF, DDoS-Schutz und dortige Sperren umgehen; deshalb nimmt der Ursprung
    # nur Verbindungen aus den oben fest hinterlegten Cloudflare-Netzen an.
    if ($afk_from_cloudflare = 0) { return 403; }
    return 308 https://example.invalid$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.invalid example.invalid;

    if ($afk_from_cloudflare = 0) { return 403; }

    ssl_certificate     /etc/letsencrypt/live/example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.invalid/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 4M;

    access_log /var/log/nginx/afksystems.access.log;
    error_log  /var/log/nginx/afksystems.error.log;

    server_tokens off;
    # HSTS setzt der Dienst selbst (server/index.js), und zwar mit zwei Jahren und `preload`.
    # Stand es hier noch einmal, gingen zwei `Strict-Transport-Security`-Zeilen hinaus – die
    # schwächere zuerst oder zuletzt, je nach Reihenfolge, und welche gilt, ist dann eine Frage
    # des Browsers statt eine Entscheidung. Eine Kopfzeile, eine Stelle.
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 15s;

    # Der Dienst liefert Startseite, Dashboard und API aus einer Hand – nginx reicht alles durch.
    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Land aus Cloudflare, für die Besucher-Statistik im Admin-Bereich (server/traffic.js).
        # Kein GeoIP nötig: Cloudflare weiß es schon, es wurde nur bisher nicht durchgereicht.
        proxy_set_header   CF-IPCountry $http_cf_ipcountry;
        # Normale HTML-, API- und Asset-Antworten profitieren von nginx-Puffern: ein langsamer
        # Browser hält den Node-Prozess nicht mehr an einer offenen Antwort fest. Die drei echten
        # WebSocket-/Upload-Orte unten bleiben ausdrücklich ungepuffert.
        proxy_buffering    on;
    }

    # Anhänge an Tickets dürfen 20 MB haben (server/attachments.js). Ohne diesen Block gilt die
    # Grenze von oben, und nginx lehnt jeden größeren Screenshot mit 413 ab, bevor das Panel ihn
    # überhaupt sieht – der Kunde bekäme eine Fehlermeldung ohne Erklärung.
    location = /api/tickets/files {
        client_max_body_size 21M;
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }

    # Der Discord-Bot hält einen eigenen WebSocket offen. Ohne diesen Block fällt die Anfrage in
    # `location /`, nginx entfernt das Upgrade und Express beantwortet das normale GET mit 404.
    location = /api/bot/stream {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Authorization $http_authorization;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering    off;
    }

    # Die Standorte halten ebenfalls einen WebSocket offen und melden sich mit ihrem Token im
    # Authorization-Kopf. Ohne diesen Block landet die Anfrage in `location /`, nginx entfernt das
    # Upgrade, und ein Standort bekommt nie eine Leitung.
    location = /api/node/stream {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Authorization $http_authorization;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering    off;
    }

    # Die Client-Dateien für einen Standort sind ein paar Megabyte groß.
    location /api/node/ {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Authorization $http_authorization;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }

    # Der Live-Chat läuft über einen WebSocket: Upgrade durchreichen und lange offen halten.
    location /api/ws {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering    off;
    }

    # Schriften, Bilder, CSS und JS.
    #
    # Wie lange etwas liegen bleiben darf, entscheidet der Dienst: Adressen mit Fingerabdruck
    # (/assets/v/<version>/…) bekommen ein Jahr, alle anderen fünf Minuten. Hier stand vorher
    # pauschal "expires 7d" – das hat nach jedem Deployment neues HTML mit tagealtem CSS und
    # JavaScript zusammengespannt, und die Seite sah kaputt aus. Deshalb: nicht überschreiben.
    location /assets/ {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
