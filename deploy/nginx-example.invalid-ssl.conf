# nginx-Konfiguration für example.invalid – die Fassung **mit** TLS.
#
# Warum es diese Datei gibt: certbot schreibt seinen TLS-Block in die Datei unter
# /etc/nginx/sites-available/. install.sh kopiert die Vorlage aus dem Repository aber bei jedem
# Aufruf dorthin – und damit wäre der Block bei jedem Deployment wieder weg. Steht die Domain
# hinter Cloudflare, fällt der Ursprungsserver dann auf Port 443 in irgendeinen anderen vHost, und
# die Seite zeigt plötzlich etwas Fremdes. Deshalb gehört TLS hier ins Repository, nicht in eine
# Datei, die überschrieben wird.
#
# install.sh nimmt diese Fassung automatisch, sobald es
# /etc/letsencrypt/live/example.invalid/fullchain.pem gibt.
#
# Port 80 bleibt bewusst bedient und leitet nicht auf HTTPS um: stünde Cloudflare auf "Flexible",
# spräche es den Ursprung über Port 80 an und eine Umleitung liefe im Kreis.

map $http_cf_connecting_ip $afk_client_ip {
    default   $http_cf_connecting_ip;
    ""        $remote_addr;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.invalid example.invalid;

    ssl_certificate     /etc/letsencrypt/live/example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.invalid/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 4M;

    access_log /var/log/nginx/afksystems.access.log;
    error_log  /var/log/nginx/afksystems.error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Der Dienst liefert Startseite, Dashboard und API aus einer Hand – nginx reicht alles durch.
    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
    }

    # Der Discord-Bot hält einen eigenen WebSocket offen. Ohne diesen Block fällt die Anfrage in
    # `location /`, nginx entfernt das Upgrade und Express beantwortet das normale GET mit 404.
    location = /api/bot/stream {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Authorization $http_authorization;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering    off;
    }

    # Der Live-Chat läuft über einen WebSocket: Upgrade durchreichen und lange offen halten.
    location /api/ws {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering    off;
    }

    # Schriften, Bilder, CSS und JS.
    #
    # Wie lange etwas liegen bleiben darf, entscheidet der Dienst: Adressen mit Fingerabdruck
    # (/assets/v/<version>/…) bekommen ein Jahr, alle anderen fünf Minuten. Hier stand vorher
    # pauschal "expires 7d" – das hat nach jedem Deployment neues HTML mit tagealtem CSS und
    # JavaScript zusammengespannt, und die Seite sah kaputt aus. Deshalb: nicht überschreiben.
    location /assets/ {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
