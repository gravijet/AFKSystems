# nginx-Konfiguration für example.invalid – die Fassung **ohne** TLS.
#
# Sie ist nur für den allerersten Aufbau da, solange es noch kein Zertifikat gibt. Sobald
# /etc/letsencrypt/live/example.invalid/ existiert, nimmt install.sh automatisch die Datei
# nginx-example.invalid-ssl.conf – siehe dort, warum das wichtig ist.
#
#   sudo ./deploy/install.sh
#   sudo certbot --nginx -d example.invalid      # einmalig, legt das Zertifikat an
#   sudo ./deploy/install.sh                   # danach greift die TLS-Fassung
#
# Läuft die Domain über Cloudflare, gehört die SSL-Einstellung dort auf "Full (strict)".

# Nur eine TCP-Verbindung aus einem offiziellen Cloudflare-Netz darf CF-Connecting-IP setzen.
# `$remote_addr` wird auf diesem Server durch ngx_http_realip_module bereits auf die Besucher-IP
# umgeschrieben; `$realip_remote_addr` bleibt dagegen immer die tatsächliche TCP-Gegenstelle.
# Quelle: https://www.cloudflare.com/ips/ (geprüft 2026-09-02).
geo $realip_remote_addr $afk_from_cloudflare {
    default 0;
    192.0.2.1/20 1;
    192.0.2.1/22 1;
    192.0.2.1/22 1;
    192.0.2.1/22 1;
    192.0.2.1/18 1;
    192.0.2.1/18 1;
    192.0.2.1/20 1;
    192.0.2.1/20 1;
    192.0.2.1/22 1;
    192.0.2.1/17 1;
    192.0.2.1/15 1;
    192.0.2.1/13 1;
    192.0.2.1/14 1;
    192.0.2.1/13 1;
    192.0.2.1/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

map "$afk_from_cloudflare:$http_cf_connecting_ip" $afk_client_ip {
    ~^1:(?<afk_cloudflare_client>[0-9A-Fa-f:.]+)$ $afk_cloudflare_client;
    default $remote_addr;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.invalid example.invalid;

    # Auch vor dem ersten Zertifikat gilt: Die öffentliche Kante ist Cloudflare. Ein direkter
    # Zugriff auf die Ursprungs-IP darf dessen WAF, DDoS-Schutz und Sperren nicht umgehen.
    if ($afk_from_cloudflare = 0) { return 403; }

    client_max_body_size 4M;

    access_log /var/log/nginx/afksystems.access.log;
    error_log  /var/log/nginx/afksystems.error.log;

    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 15s;

    # Der Dienst liefert Startseite, Dashboard und API aus einer Hand – nginx reicht alles durch.
    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Normale HTML-, API- und Asset-Antworten profitieren von nginx-Puffern: ein langsamer
        # Browser hält den Node-Prozess nicht mehr an einer offenen Antwort fest. Die drei echten
        # WebSocket-/Upload-Orte unten bleiben ausdrücklich ungepuffert.
        proxy_buffering    on;
    }

    # Anhänge an Tickets dürfen 20 MB haben (server/attachments.js). Ohne diesen Block gilt die
    # Grenze von oben, und nginx lehnt jeden größeren Screenshot mit 413 ab, bevor das Panel ihn
    # überhaupt sieht – der Kunde bekäme eine Fehlermeldung ohne Erklärung.
    location = /api/tickets/files {
        client_max_body_size 21M;
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }

    # Der Discord-Bot hält einen eigenen WebSocket offen. Ohne diesen Block fällt die Anfrage in
    # `location /`, nginx entfernt das Upgrade und Express beantwortet das normale GET mit 404.
    location = /api/bot/stream {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Authorization $http_authorization;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering    off;
    }

    # Die Standorte halten ebenfalls einen WebSocket offen und melden sich mit ihrem Token im
    # Authorization-Kopf. Ohne diesen Block landet die Anfrage in `location /`, nginx entfernt das
    # Upgrade, und ein Standort bekommt nie eine Leitung.
    location = /api/node/stream {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Authorization $http_authorization;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering    off;
    }

    # Die Client-Dateien für einen Standort sind ein paar Megabyte groß.
    location /api/node/ {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Authorization $http_authorization;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }

    # Der Live-Chat läuft über einen WebSocket: Upgrade durchreichen und lange offen halten.
    location /api/ws {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering    off;
    }

    # Schriften, Bilder, CSS und JS. Wie lange etwas liegen bleiben darf, entscheidet der Dienst:
    # Adressen mit Fingerabdruck (/assets/v/<version>/…) bekommen ein Jahr, alle anderen fünf
    # Minuten. Hier nichts überschreiben – sonst trifft nach einem Deployment neues HTML auf altes
    # CSS und JavaScript.
    location /assets/ {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
