# nginx-Konfiguration für afksystems.de
#
# Bewusst nur der HTTP-Teil: den TLS-Block legt certbot selbst an und trägt die Zertifikatszeilen
# ein. Genau so ist es bei den übrigen Seiten auf diesem Server auch gemacht.
#
#   sudo cp deploy/nginx-afksystems.de.conf /etc/nginx/sites-available/afksystems.de
#   sudo ln -sf /etc/nginx/sites-available/afksystems.de /etc/nginx/sites-enabled/afksystems.de
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d afksystems.de -d www.afksystems.de
#
# Läuft die Domain über Cloudflare, muss die SSL-Einstellung dort auf "Full (strict)" stehen,
# damit das Zertifikat vom Ursprungsserver auch benutzt wird.

server {
    listen 80;
    listen [::]:80;
    server_name afksystems.de www.afksystems.de;

    client_max_body_size 4M;

    access_log /var/log/nginx/afksystems.access.log;
    error_log  /var/log/nginx/afksystems.error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Der Dienst liefert Startseite, Dashboard und API aus einer Hand – nginx reicht alles durch.
    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
    }

    # Der Live-Chat läuft über einen WebSocket: Upgrade durchreichen und lange offen halten.
    location /api/ws {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering    off;
    }

    # Schriften, Bilder, CSS und JS haben feste Namen – die dürfen im Browser liegen bleiben.
    location /assets/ {
        proxy_pass       http://127.0.0.1:3010;
        proxy_set_header Host $host;
        expires          7d;
        add_header       Cache-Control "public";
    }
}
