# nginx-Konfiguration für afksystems.de – die Fassung **ohne** TLS.
#
# Sie ist nur für den allerersten Aufbau da, solange es noch kein Zertifikat gibt. Sobald
# /etc/letsencrypt/live/afksystems.de/ existiert, nimmt install.sh automatisch die Datei
# nginx-afksystems.de-ssl.conf – siehe dort, warum das wichtig ist.
#
#   sudo ./deploy/install.sh
#   sudo certbot --nginx -d afksystems.de      # einmalig, legt das Zertifikat an
#   sudo ./deploy/install.sh                   # danach greift die TLS-Fassung
#
# Läuft die Domain über Cloudflare, gehört die SSL-Einstellung dort auf "Full (strict)".

# Hinter Cloudflare steht in $remote_addr die Adresse von Cloudflare, nicht die des Besuchers.
# Die echte kommt im Kopf CF-Connecting-IP – ohne diese Zuordnung stünde im Panel bei jeder
# Sitzung dieselbe fremde Adresse.
map $http_cf_connecting_ip $afk_client_ip {
    default   $http_cf_connecting_ip;
    ""        $remote_addr;
}

server {
    listen 80;
    listen [::]:80;
    server_name afksystems.de www.afksystems.de;

    client_max_body_size 4M;

    access_log /var/log/nginx/afksystems.access.log;
    error_log  /var/log/nginx/afksystems.error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Der Dienst liefert Startseite, Dashboard und API aus einer Hand – nginx reicht alles durch.
    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
    }

    # Der Discord-Bot hält einen eigenen WebSocket offen. Ohne diesen Block fällt die Anfrage in
    # `location /`, nginx entfernt das Upgrade und Express beantwortet das normale GET mit 404.
    location = /api/bot/stream {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Authorization $http_authorization;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering    off;
    }

    # Der Live-Chat läuft über einen WebSocket: Upgrade durchreichen und lange offen halten.
    location /api/ws {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering    off;
    }

    # Schriften, Bilder, CSS und JS. Wie lange etwas liegen bleiben darf, entscheidet der Dienst:
    # Adressen mit Fingerabdruck (/assets/v/<version>/…) bekommen ein Jahr, alle anderen fünf
    # Minuten. Hier nichts überschreiben – sonst trifft nach einem Deployment neues HTML auf altes
    # CSS und JavaScript.
    location /assets/ {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $afk_client_ip;
        proxy_set_header   X-Forwarded-For $afk_client_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
