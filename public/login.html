<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anmelden – AFKSystems</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/app.css" />
    <script>
      const t = localStorage.getItem('afk-theme');
      if (t && t !== 'system') document.documentElement.setAttribute('data-theme', t);
    </script>
  </head>
  <body>
    <main class="auth">
      <div class="box">
        <a class="brand" href="/" style="justify-content: center; margin-bottom: 1.5rem">
          <img class="logo" src="/assets/img/logo.svg" alt="" />AFKSystems
        </a>
        <div class="card">
          <h1 style="font-size: 1.35rem">Anmelden</h1>
          <p class="small muted" style="margin-top: 0.35rem">
            Willkommen zurück. Deine Bots warten.
          </p>
          <form id="form" class="stack" style="margin-top: 1.5rem">
            <div class="field">
              <label for="login">E-Mail oder Benutzername</label>
              <input id="login" name="login" type="text" autocomplete="username" required />
            </div>
            <div class="field">
              <label for="password">Passwort</label>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
            </div>
            <button class="btn btn-primary btn-block" type="submit">Anmelden</button>
            <p id="error" class="small hide" style="color: var(--bad)"></p>
          </form>
        </div>
        <p class="small muted center" style="margin-top: 1rem">
          Noch kein Konto? <a href="/register.html" style="color: var(--primary)">Jetzt anlegen</a>
        </p>
      </div>
    </main>
    <script type="module">
      import { api, $ } from '/assets/js/ui.js';

      const form = $('#form');
      const error = $('#error');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.classList.add('hide');
        const button = form.querySelector('button');
        button.disabled = true;
        button.textContent = 'Einen Moment ...';
        try {
          await api('/auth/login', {
            method: 'POST',
            body: { login: $('#login').value, password: $('#password').value },
          });
          location.href = new URLSearchParams(location.search).get('weiter') || '/app/';
        } catch (problem) {
          error.textContent = problem.message;
          error.classList.remove('hide');
          button.disabled = false;
          button.textContent = 'Anmelden';
        }
      });
    </script>
  </body>
</html>
