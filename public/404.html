<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seite nicht gefunden – AFKSystems</title>
    <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/app.css" />
    <script>
      const t = localStorage.getItem('afk-theme');
      if (t && t !== 'system') document.documentElement.setAttribute('data-theme', t);
    </script>
  </head>
  <body>
    <main class="auth">
      <div class="box center">
        <a class="brand" href="/" style="justify-content: center; margin-bottom: 1.5rem">
          <img class="logo" src="/assets/img/logo.svg" alt="" />AFKSystems
        </a>
        <div class="card">
          <h1 style="font-size: 1.35rem">Diese Seite gibt es nicht</h1>
          <p class="muted light" style="margin-top: 0.75rem">
            Vielleicht ein alter Link. Zurück zur Startseite oder direkt ins Dashboard.
          </p>
          <div class="row" style="justify-content: center; margin-top: 1.5rem">
            <a class="btn" href="/">Startseite</a>
            <a class="btn btn-primary" href="/app/">Dashboard</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
