{{> head}}
    <main class="auth" id="main">
      <div class="auth-box">
        <a class="brand" href="/{{lang}}">
          <img class="logo" src="{{assets}}/img/logo-128.webp" width="32" height="32" alt="" />
          <span>{{brand}}</span>
        </a>

        <div class="auth-card">
          <h1>{{auth.reset.title}}</h1>

          <form id="form" class="stack" novalidate>
            <div class="field">
              <label for="password">{{auth.register.password}}</label>
              <input id="password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="256" />
              <span class="hint">{{auth.register.passwordHint}}</span>
            </div>
            <div class="field">
              <label for="password2">{{auth.register.password2}}</label>
              <input id="password2" name="password2" type="password" autocomplete="new-password" required minlength="12" maxlength="256" />
            </div>
            <!-- Der zweite Faktor, wenn das Konto ihn hat. Er steht erst da, wenn der Server
                 danach fragt: Vorher wüsste diese Seite nicht, für welches Konto die Marke gilt,
                 und ein Feld, das bei allen anderen leer bleiben muss, ist eine Frage, die
                 aussieht wie eine Pflicht. -->
            <div class="field hide" id="totp-field">
              <label for="code">{{auth.totp.label}}</label>
              <input id="code" name="code" type="text" autocomplete="one-time-code"
                     spellcheck="false" autocapitalize="characters" maxlength="11" class="code-input code-input-wide" />
              <span class="hint">{{auth.totp.resetHint}}</span>
            </div>
            <p id="error" class="form-error hide" role="alert"></p>
            <button class="btn btn-primary btn-block" type="submit">{{auth.reset.submit}}</button>
          </form>

          <p id="done" class="note hide">{{auth.reset.done}}</p>
        </div>

        <p class="auth-alt"><a href="/{{lang}}/login">{{auth.login.title}}</a></p>
      </div>
    </main>
    <script type="module" src="{{assets}}/js/auth.js"></script>
  </body>
</html>
