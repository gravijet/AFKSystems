{{> head}}
    <main class="auth" id="main">
      <div class="auth-box">
        <a class="brand" href="/{{lang}}">
          <img class="logo" src="{{assets}}/img/logo.svg" alt="" />
          <span>{{brand}}</span>
        </a>

        <div class="auth-card">
          <h1>{{auth.reset.title}}</h1>

          <form id="form" class="stack" novalidate>
            <div class="field">
              <label for="password">{{auth.register.password}}</label>
              <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" />
              <span class="hint">{{auth.register.passwordHint}}</span>
            </div>
            <div class="field">
              <label for="password2">{{auth.register.password2}}</label>
              <input id="password2" name="password2" type="password" autocomplete="new-password" required minlength="8" />
            </div>
            <p id="error" class="form-error hide" role="alert"></p>
            <button class="btn btn-primary btn-block" type="submit">{{auth.reset.submit}}</button>
          </form>

          <p id="done" class="note hide">{{auth.reset.done}}</p>
        </div>

        <p class="auth-alt"><a href="/{{lang}}/login">{{auth.login.title}}</a></p>
      </div>
    </main>
    <script type="module" src="{{assets}}/js/auth.js"></script>
  </body>
</html>
