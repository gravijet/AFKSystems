{{> head}}
    <main class="auth" id="main">
      <div class="auth-box">
        <a class="brand" href="/{{lang}}">
          <img class="logo" src="{{assets}}/img/logo-128.webp" width="32" height="32" alt="" />
          <span>{{brand}}</span>
        </a>

        <div class="auth-card" id="card">
          <h1>{{auth.register.title}}</h1>
          <p class="auth-lead">{{auth.register.lead}}</p>

          <p id="closed" class="note warn hide">{{auth.register.closed}}</p>

          <!-- Ein Konto entsteht auch über Discord oder Google: die E-Mail-Adresse kommt von
               dort, ein Passwort braucht es dann gar nicht. Steht oben, weil es der kürzere Weg
               ist – wer lieber tippt, findet das Formular direkt darunter. -->
          <div id="oauth" class="hide">
            <div class="stack" style="gap:.5rem">
              <a class="btn btn-block hide" id="oauth-discord"
                 href="/api/auth/discord/start?mode=login">{{auth.register.discord}}</a>
              <a class="btn btn-block hide" id="oauth-google"
                 href="/api/auth/google/start?mode=login">{{auth.register.google}}</a>
            </div>
            <div class="or"><span>{{auth.or}}</span></div>
          </div>

          <form id="form" class="stack" novalidate>
            <div class="field">
              <label for="email">{{auth.register.email}}</label>
              <input id="email" name="email" type="email" autocomplete="email" required />
            </div>
            <div class="field">
              <label for="username">{{auth.register.username}}</label>
              <input id="username" name="username" type="text" autocomplete="username" required />
              <span class="hint">{{auth.register.usernameHint}}</span>
            </div>
            <div class="field">
              <label for="password">{{auth.register.password}}</label>
              <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" />
              <span class="hint">{{auth.register.passwordHint}}</span>
            </div>
            <div class="field">
              <label for="password2">{{auth.register.password2}}</label>
              <input id="password2" name="password2" type="password" autocomplete="new-password" required minlength="8" />
            </div>
            <label class="check">
              <input id="terms" type="checkbox" required />
              <span>{{auth.register.terms}}</span>
            </label>
            <p id="error" class="form-error hide" role="alert"></p>
            <button class="btn btn-primary btn-block" type="submit">{{auth.register.submit}}</button>
          </form>
        </div>

        <!-- Nach dem Anlegen, wenn der Betreiber die E-Mail-Bestätigung eingeschaltet hat. -->
        <div class="auth-card hide" id="sent">
          <h1>{{auth.register.checkMail.title}}</h1>
          <p class="auth-lead" id="sent-text"></p>
          <button class="btn btn-block" id="resend" type="button">{{auth.register.resend}}</button>
        </div>

        <p class="auth-alt">
          <a href="/{{lang}}/login">{{auth.register.have}}</a>
        </p>
        <p class="auth-alt"><a href="/{{lang}}">{{common.back}}</a></p>
      </div>
    </main>
    <script type="module" src="{{assets}}/js/auth.js"></script>
  </body>
</html>
