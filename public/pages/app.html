{{> head}}
    <div class="app">
      <aside class="side boot-side" id="side" aria-label="{{nav.menu}}" aria-busy="true">
        <div class="side-top">
          <div class="side-brand-row">
            <a class="side-brand" href="/{{lang}}">
              <img class="side-logo" src="{{assets}}/img/logo-128.webp" alt="" width="28" height="28" />
              <span>{{brand}}</span>
            </a>
          </div>
          <span class="boot-line boot-line-wide" aria-hidden="true"></span>
        </div>
        <div class="side-scroll boot-side-lines" aria-hidden="true">
          <span class="boot-line"></span><span class="boot-line"></span><span class="boot-line boot-line-short"></span>
          <span class="boot-line"></span><span class="boot-line boot-line-short"></span><span class="boot-line"></span>
        </div>
        <div class="side-bottom"><span class="boot-line boot-line-wide" aria-hidden="true"></span></div>
      </aside>
      <main class="main" id="main" aria-busy="true">
        <div class="boot-main" role="status">
          <span class="boot-kicker">{{common.loading}}</span>
          <span class="boot-title" aria-hidden="true"></span>
          <div class="grid three boot-cards" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <span class="boot-panel" aria-hidden="true"></span>
        </div>
      </main>
    </div>
    <button id="side-backdrop" class="hide" type="button" aria-label="{{common.close}}"></button>
    <nav class="mobile-nav" id="mobile-nav" aria-label="{{nav.menu}}"></nav>
    <script type="module" src="{{assets}}/js/app.js"></script>
  </body>
</html>
