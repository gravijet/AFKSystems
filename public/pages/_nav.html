    <a class="skip" href="#main">{{nav.skip}}</a>
    <header class="site-head">
      <div class="page">
        <a class="brand" href="/{{lang}}">
          <img class="logo" src="{{assets}}/img/logo-128.webp" width="32" height="32" alt="" fetchpriority="high" />
          <span>{{brand}}</span>
        </a>

        <div class="mobile-language-picker language-picker" role="group" aria-label="{{common.language}}">
          <a href="/de{{path}}" hreflang="de" lang="de" data-language="de"
            aria-label="Deutsch" title="Deutsch" {{deCurrent}}>DE</a>
          <a href="/en{{path}}" hreflang="en" lang="en" data-language="en"
            aria-label="English" title="English" {{enCurrent}}>EN</a>
        </div>

        <button class="site-menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu"
          aria-label="{{nav.menu}}">
          <span class="site-menu-lines" aria-hidden="true"><i></i><i></i></span>
          <span>{{nav.menu}}</span>
        </button>

        <div class="site-menu" id="site-menu">
          <nav class="site-links" aria-label="{{nav.menu}}">
            <a href="/{{lang}}/features" {{curFeatures}}>{{nav.features}}</a>
            <a href="/{{lang}}/pricing" {{curPricing}}>{{nav.pricing}}</a>
            <a href="/{{lang}}/faq" {{curFaq}}>{{nav.faq}}</a>
          </nav>

          <div class="site-actions">
            {{discordNav}}
            <div class="language-picker" role="group" aria-label="{{common.language}}">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>
              </svg>
              <a href="/de{{path}}" hreflang="de" lang="de" data-language="de" {{deCurrent}}>Deutsch</a>
              <a href="/en{{path}}" hreflang="en" lang="en" data-language="en" {{enCurrent}}>English</a>
            </div>
            <div class="themes" id="themes" role="group" aria-label="{{common.appearance}}">
              <button type="button" data-theme="light" title="{{common.light}}" aria-label="{{common.light}}" aria-pressed="false">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
              </button>
              <button type="button" data-theme="system" title="{{common.system}}" aria-label="{{common.system}}" aria-pressed="false">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
              </button>
              <button type="button" data-theme="dark" title="{{common.dark}}" aria-label="{{common.dark}}" aria-pressed="false">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9"/></svg>
              </button>
            </div>
            <span class="head-auth" id="head-auth" data-dashboard-href="/{{lang}}/app"
              data-dashboard-label="{{nav.dashboard}}">
              <a class="btn btn-sm" href="/{{lang}}/login">{{nav.login}}</a>
              <a class="btn btn-primary btn-sm" href="/{{lang}}/register">{{nav.register}}</a>
            </span>
          </div>
        </div>
      </div>
    </header>
