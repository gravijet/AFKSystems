<!doctype html>
<html lang="{{lang}}" data-shield="{{shield}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="theme-color" content="#206cfe" />
    {{robotsTag}}
    <link rel="icon" href="{{assets}}/img/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="{{assets}}/img/apple-touch-icon.png" />
    <link rel="canonical" href="{{origin}}/{{lang}}{{path}}" />
    <link rel="alternate" hreflang="en" href="{{origin}}/en{{path}}" />
    <link rel="alternate" hreflang="de" href="{{origin}}/de{{path}}" />
    <link rel="alternate" hreflang="x-default" href="{{origin}}/en{{path}}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{origin}}/{{lang}}{{path}}" />
    <meta property="og:locale" content="{{ogLocale}}" />
    <meta property="og:image" content="{{origin}}/assets/img/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="{{assets}}/css/app.css" />
    <script src="{{assets}}/js/theme.js"></script>
    <!-- Steht bewusst im Kopf: der Schutz soll gelten, bevor der erste Inhalt zu sehen ist. -->
    <script src="{{assets}}/js/shield.js"></script>
  </head>
  <body class="{{bodyClass}}" data-shield-note="{{shield.note}}">
