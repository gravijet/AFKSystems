<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="theme-color" content="#206cfe" />
    {{robotsTag}}
    <link rel="icon" href="{{assets}}/img/logo.svg" type="image/svg+xml" />
    <link rel="canonical" href="{{origin}}/{{lang}}{{path}}" />
    <link rel="alternate" hreflang="en" href="{{origin}}/en{{path}}" />
    <link rel="alternate" hreflang="de" href="{{origin}}/de{{path}}" />
    <link rel="alternate" hreflang="x-default" href="{{origin}}/en{{path}}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{origin}}/{{lang}}{{path}}" />
    <meta property="og:locale" content="{{ogLocale}}" />
    <link rel="stylesheet" href="{{assets}}/css/app.css" />
    <script>
      // Vor dem ersten Bild: gespeichertes Aussehen setzen, damit nichts aufblitzt.
      const stored = localStorage.getItem('afk-theme');
      if (stored && stored !== 'system') document.documentElement.setAttribute('data-theme', stored);
    </script>
  </head>
  <body class="{{bodyClass}}">
