{{> head}}
    <main class="auth" id="main">
      <div class="auth-box">
        <a class="brand" href="/{{lang}}">
          <img class="logo" src="{{assets}}/img/logo-128.webp" width="32" height="32" alt="" />
          <span>{{brand}}</span>
        </a>

        <!-- Der zweite Schritt: der Code aus der E-Mail. Er steht als eigene Karte hier und nicht
             auf einer eigenen Seite – ein Seitenwechsel mitten in einer Anmeldung sähe aus wie
             eine Weiterleitung, und genau das ist es nicht: Es ist derselbe Vorgang, nur eine
             Frage weiter. auth.js blendet um. -->
        <div class="auth-card hide" id="code-card">
          <h1>{{auth.code.title}}</h1>
          <p class="auth-lead" id="code-lead">{{auth.code.lead}}</p>

          <form id="code-form" class="stack" novalidate>
            <div class="field">
              <label for="code">{{auth.code.label}}</label>
              <!-- inputmode/autocomplete: Auf dem Telefon kommt die Zifferntastatur, und iOS und
                   Android bieten den Code aus der eben eingetroffenen Nachricht zum Einsetzen an.
                   Ohne `one-time-code` tun sie das nicht. -->
              <input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]*"
                     autocomplete="one-time-code" maxlength="6" required
                     class="code-input" autofocus />
            </div>
            <p id="code-error" class="form-error hide" role="alert"></p>
            <button class="btn btn-primary btn-block" type="submit">{{auth.code.submit}}</button>
          </form>

          <p class="auth-alt">
            <button class="linkish" type="button" id="code-resend">{{auth.code.resend}}</button>
            <span aria-hidden="true">·</span>
            <button class="linkish" type="button" id="code-back">{{auth.code.back}}</button>
          </p>
        </div>

        <!-- Der zweite Faktor aus der Authenticator-App. Eigene Karte wie der Anmeldecode und aus
             demselben Grund: Es ist derselbe Vorgang, nur eine Frage weiter. Zwei Felder, von
             denen immer genau eines zu sehen ist – sechs Ziffern aus der App, oder, wer das
             Gerät nicht hat, einer der zehn Wiederherstellungscodes vom Einrichten. -->
        <div class="auth-card hide" id="totp-card">
          <h1>{{auth.totp.title}}</h1>
          <p class="auth-lead" id="totp-lead">{{auth.totp.lead}}</p>

          <form id="totp-form" class="stack" novalidate>
            <div class="field" id="totp-app-field">
              <label for="totp-code">{{auth.totp.label}}</label>
              <input id="totp-code" name="totp-code" type="text" inputmode="numeric" pattern="[0-9]*"
                     autocomplete="one-time-code" maxlength="6" class="code-input" />
            </div>
            <div class="field hide" id="totp-recovery-field">
              <label for="totp-recovery">{{auth.totp.recoveryLabel}}</label>
              <input id="totp-recovery" name="totp-recovery" type="text" autocomplete="off"
                     spellcheck="false" autocapitalize="characters" maxlength="11"
                     class="code-input code-input-wide" placeholder="XXXXX-XXXXX" />
            </div>
            <p id="totp-error" class="form-error hide" role="alert"></p>
            <button class="btn btn-primary btn-block" type="submit">{{auth.totp.submit}}</button>
          </form>

          <p class="auth-alt">
            <button class="linkish" type="button" id="totp-switch">{{auth.totp.lost}}</button>
            <span aria-hidden="true">·</span>
            <button class="linkish" type="button" id="totp-back">{{auth.code.back}}</button>
          </p>
        </div>

        <div class="auth-card" id="login-card">
          <h1>{{auth.login.title}}</h1>
          <p class="auth-lead">{{auth.login.lead}}</p>

          <form id="form" class="stack" novalidate>
            <div class="field">
              <label for="login">{{auth.login.identifier}}</label>
              <input id="login" name="login" type="text" autocomplete="username" required />
            </div>
            <div class="field">
              <label for="password">{{auth.login.password}}</label>
              <input id="password" name="password" type="password" autocomplete="current-password" required />
            </div>
            <p id="error" class="form-error hide" role="alert"></p>
            <button class="btn btn-primary btn-block" type="submit">{{auth.login.submit}}</button>
          </form>

          <!-- Anmelden über Discord oder Google. Beide Knöpfe zeigt auth.js nur, wenn der
               Betreiber den Anbieter eingerichtet **und** freigeschaltet hat. -->
          <div id="oauth" class="hide">
            <div class="or"><span>{{auth.or}}</span></div>
            <div class="stack" style="gap:.5rem">
              <a class="btn btn-block hide" id="oauth-discord"
                 href="/api/auth/discord/start?mode=login">
                <svg class="oauth-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.5 5.34A16.3 16.3 0 0 0 15.44 4l-.5 1.03a15.2 15.2 0 0 0-5.87 0L8.56 4A16.5 16.5 0 0 0 4.5 5.35C1.93 9.2 1.24 12.96 1.6 16.66a16.5 16.5 0 0 0 4.98 2.52l1.22-1.67c-.67-.25-1.31-.56-1.91-.92l.47-.36a11.7 11.7 0 0 0 11.28 0l.47.36c-.6.36-1.24.67-1.91.92l1.22 1.67a16.5 16.5 0 0 0 4.98-2.52c.42-4.29-.72-8.02-2.9-11.32ZM8.5 14.75c-1.18 0-2.15-1.1-2.15-2.45s.94-2.45 2.15-2.45 2.17 1.1 2.15 2.45c0 1.35-.95 2.45-2.15 2.45Zm7 0c-1.18 0-2.15-1.1-2.15-2.45s.94-2.45 2.15-2.45 2.17 1.1 2.15 2.45c0 1.35-.94 2.45-2.15 2.45Z"/></svg>
                <span>{{auth.login.discord}}</span></a>
              <a class="btn btn-block hide" id="oauth-google"
                 href="/api/auth/google/start?mode=login">
                <svg class="oauth-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285f4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.91h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.32 2.98-7.4Z"/><path fill="#34a853" d="M12 22c2.7 0 4.96-.9 6.62-2.37l-3.24-2.54c-.9.6-2.05.96-3.38.96-2.6 0-4.8-1.76-5.59-4.12H3.07v2.62A10 10 0 0 0 12 22Z"/><path fill="#fbbc05" d="M6.41 13.93A6 6 0 0 1 6.1 12c0-.67.11-1.32.31-1.93V7.45H3.07A10 10 0 0 0 2 12c0 1.61.38 3.14 1.07 4.55l3.34-2.62Z"/><path fill="#ea4335" d="M12 5.95c1.47 0 2.79.5 3.83 1.5l2.87-2.88A9.64 9.64 0 0 0 12 2a10 10 0 0 0-8.93 5.45l3.34 2.62C7.2 7.71 9.4 5.95 12 5.95Z"/></svg>
                <span>{{auth.login.google}}</span></a>
            </div>
          </div>
        </div>

        <p class="auth-alt">
          <a href="/{{lang}}/forgot">{{auth.login.forgot}}</a>
          <span aria-hidden="true">·</span>
          <a href="/{{lang}}/register">{{auth.login.noAccount}}</a>
        </p>
        <p class="auth-alt"><a href="/{{lang}}">{{common.back}}</a></p>
      </div>
    </main>
    <script type="module" src="{{assets}}/js/auth.js"></script>
  </body>
</html>
